# ============================================================================
# LINKS CONFIGURATION
# ============================================================================
# arXiv / Code / Dataset resource links, shown as buttons in the hero.
# Leave a link `null` until it's genuinely available -- the button then
# renders as a disabled "coming soon" state rather than a guessed URL.
# Parsed by static/js/yaml-lite.js and rendered by static/js/main.js.
# ============================================================================

# Set to the arXiv abstract page once the preprint is posted, e.g.
# "https://arxiv.org/abs/xxxx.xxxxx". Left null -> button shows only its
# logo, disabled, and is not clickable.
arxiv: https://arxiv.org/abs/2609.12718

# Paper footnote: "Data / Code will be released upon publication" -- so
# this is genuinely not available yet, not a guess.
code: https://github.com/lilysli/when-rubrics-fail 

# The dataset release, hosted on Hugging Face. Paper footnote: "Data /
# Code will be released upon publication" -- rendered as a "Dataset"
# button (with the Hugging Face logo) rather than naming the platform.
dataset: https://huggingface.co/datasets/JackJ3636/when-rubrics-fail 

# Open Graph / Twitter card preview image path (1200x630). NOT auto-applied
# to the <meta property="og:image">/<meta name="twitter:image"> tags in
# index.html's <head> -- crawlers need those static, so keep both in sync
# by hand if you change this.
ogImage: static/images/og-image.png
